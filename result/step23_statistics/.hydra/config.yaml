task_name: analyze
tags:
- analysis
seed: 42
data:
  _target_: src.data.bt_mri_datamodule.BTMRIDataModule
  data_dir: ${paths.data_dir}
  raw_subdir: raw/bt_mri
  split_subpath: splits/dataset_split.csv
  recipe: null
  image_size: 224
  normalize: imagenet
  crop_background: false
  augment: true
  use_weighted_sampler: true
  batch_size: 32
  num_workers: 0
  pin_memory: false
  seed: 42
  val_frac: 0.15
  test_frac: 0.15
model:
  criterion:
    _target_: src.models.components.losses.CrossEntropyLoss
    use_class_weights: true
    label_smoothing: 0.0
  _target_: src.models.mri_classification_module.MRIClassificationModule
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 30
  net:
    _target_: src.models.components.multiscale.MultiscaleClassifier.from_arm
    arm: arm6_spatial_gate
    num_classes: 4
    channels: 32
    dropout: 0.3
  num_classes: 4
  class_names:
  - Glioma
  - Meningioma
  - Pituitary
  - No-tumor
  compile: false
analysis:
  _target_: src.analysis.statistical_report.StatisticalReport
  name: step23_statistics
  _recursive_: false
  ablation_dir: logs/analyze/runs_swin/step21_ablation
  primary_comparisons:
  - id: H1
    row_a: A2
    row_b: A1
    rq: RQ2
    question: Does diffusion preprocessing beat the conventional Step 5 pipeline?
  - id: H2
    row_a: A5
    row_b: A4
    rq: RQ4
    question: Does the adaptive quantum branch beat a fixed QCNN?
  - id: H3
    row_a: A7
    row_b: A6
    rq: RQ6
    question: Does the imbalance-aware loss Step 14 selected help?
  - id: H4
    row_a: A6
    row_b: A3
    rq: RQ8
    question: Does adding the quantum branch and fusion beat the multiscale branch
      alone?
  secondary_comparisons:
  - id: A1_vs_A0
    row_a: A1
    row_b: A0
    note: 'Intensity treatment alone. Descriptive: not a pre-registered hypothesis.'
  - id: A3_vs_A2
    row_a: A3
    row_b: A2
    note: Adaptive multiscale against the CNN. Confounded - the backbone changes as
      well as the module - so descriptive only.
  - id: A7_vs_P
    row_a: A7
    row_b: P
    note: 'End-to-end preprocessing comparison: A7 is diffusion, P is what Step 6
      selected. P is single-seed, so this carries no seed-level claim and is reported
      descriptively.'
  alpha: 0.05
  confidence_level: 0.95
  n_resamples: 2000
  random_seed: 42
  paired_seed: 42
  minimum_wilcoxon_pairs: 6
  step16_predictions: null
  strict: false
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: false
