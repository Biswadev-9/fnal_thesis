task_name: analyze
tags:
- analysis
seed: 42
data:
  _target_: src.data.bt_mri_datamodule.BTMRIDataModule
  data_dir: ${paths.data_dir}
  raw_subdir: raw/bt_mri
  split_subpath: splits/dataset_split.csv
  recipe: null
  image_size: 224
  normalize: imagenet
  crop_background: false
  augment: true
  use_weighted_sampler: true
  batch_size: 32
  num_workers: 0
  pin_memory: false
  seed: 42
  val_frac: 0.15
  test_frac: 0.15
model:
  criterion:
    _target_: src.models.components.losses.CrossEntropyLoss
    use_class_weights: true
    label_smoothing: 0.0
  _target_: src.models.mri_classification_module.MRIClassificationModule
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 30
  net:
    _target_: src.models.components.multiscale.MultiscaleClassifier.from_arm
    arm: arm6_spatial_gate
    num_classes: 4
    channels: 32
    dropout: 0.3
  num_classes: 4
  class_names:
  - Glioma
  - Meningioma
  - Pituitary
  - No-tumor
  compile: false
analysis:
  _target_: src.analysis.robustness.RobustnessStudy
  name: step18_robustness
  _recursive_: false
  models:
    proposed:
      kind: pipeline
      classical_ckpt: logs/train/runs/step10_classical_swin/seed_42
      quantum_ckpt: logs/train/runs/step12_adaptive_quantum/seed_42
      fusion_ckpt: logs/train/runs/step15_final_swin/seed_42
      preprocess: null
      classical_model:
        _target_: src.models.mri_classification_module.MRIClassificationModule
        optimizer:
          _target_: torch.optim.AdamW
          _partial_: true
          lr: 0.0001
        net:
          _target_: src.models.components.transfer.TransferBackbone
          arch: swin_t
          num_classes: 4
          weights: null
          freeze_backbone: true
          dropout: 0.3
        num_classes: 4
      quantum_model:
        _target_: src.models.mri_classification_module.MRIClassificationModule
        optimizer:
          _target_: torch.optim.AdamW
          _partial_: true
          lr: 0.0001
        net:
          _target_: src.models.components.quantum.AdaptiveQuantumClassifier
          channels: 32
          num_classes: 4
          n_qubits: 4
          circuit_names: null
          hidden_dims:
          - 128
          - 64
          dropout: 0.3
        num_classes: 4
      fusion_model:
        _target_: src.models.feature_fusion_module.FeatureFusionModule
        optimizer:
          _target_: torch.optim.AdamW
          _partial_: true
          lr: 0.001
        net:
          _target_: src.models.components.fusion.FusedFeatureClassifier
          classical_dim: 768
          spatial_dim: 32
          quantum_dim: 4
          proj_dim: 64
          hidden_dims:
          - 128
          - 64
          num_classes: 4
          dropout: 0.4
        num_classes: 4
    efficientnet_b0:
      kind: simple
      ckpt: logs/train/runs/step09_baselines/baseline_efficientnet_b0/seed_42
      preprocess: null
      model_cfg:
        _target_: src.models.mri_classification_module.MRIClassificationModule
        optimizer:
          _target_: torch.optim.AdamW
          _partial_: true
          lr: 0.0001
        net:
          _target_: src.models.components.transfer.TransferBackbone
          arch: efficientnet_b0
          num_classes: 4
          weights: null
          freeze_backbone: true
          dropout: 0.3
        num_classes: 4
    vit:
      kind: simple
      ckpt: logs/train/runs/step09_baselines/baseline_vit/seed_42
      preprocess: null
      model_cfg:
        _target_: src.models.mri_classification_module.MRIClassificationModule
        optimizer:
          _target_: torch.optim.AdamW
          _partial_: true
          lr: 0.0001
        net:
          _target_: src.models.components.transfer.TransferBackbone
          arch: vit_b_16
          num_classes: 4
          weights: null
          freeze_backbone: true
          dropout: 0.3
        num_classes: 4
  categories: null
  image_size: 224
  normalize: imagenet
  batch_size: 32
  limit_batches: null
  accelerator: auto
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: false
